<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Information Survey</title>

  <!-- Link to CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">

    <!-- Optional Image / Logo -->
    <!-- Place your image file in the same folder and update the src -->
    <img src="assets/hero.jpg" alt="Survey Logo" class="logo" />

    <h1>User Information Survey</h1>
    <p>Please fill out the form below.</p>

    <!-- FORM -->
    <form id="userForm">

      <!-- First Name -->
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          required
        />
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          required
        />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
        />
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select an option</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
      </div>

      <!-- Birthday -->
      <div class="form-group">
        <label for="birthday">Date of Birth</label>
        <input
          type="date"
          id="birthday"
          name="birthday"
          required
        />
      </div>

      <!-- Consent -->
      <div class="form-group consent">
        <input
          type="checkbox"
          id="consent"
          name="consent"
          required
        />
        <label for="consent">
          I consent to submitting my information for this demo.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit">Submit</button>

    </form>
  </div>

  <!-- JavaScript -->
  <!-- MUST be after the form -->
  <script src="script.js"></script>
</body>
</html>
