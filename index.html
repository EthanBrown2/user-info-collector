<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Info Collector</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Landing Page -->
  <main class="landing">
    <img src="assets/city.jpg" alt="Logo" class="logo" />

    <h1>Welcome</h1>
    <p class="subtitle">
      Please click below to open the information form.
    </p>

    <button id="openModalBtn" class="primary-btn">
      Open Form
    </button>
  </main>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-card">

      <button id="closeModalBtn" class="close-btn">&times;</button>

      <h2>User Information</h2>

      <form id="userForm">

        <label>
          First Name
          <input type="text" name="firstName" required />
        </label>

        <label>
          Last Name
          <input type="text" name="lastName" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Gender
          <select name="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Prefer not to say</option>
          </select>
        </label>

        <label>
          Date of Birth
          <input type="date" name="birthday" required />
        </label>

        <label class="consent">
          <input type="checkbox" name="consent" required />
          I consent to submitting this information
        </label>

        <button type="submit" class="primary-btn">
          Submit
        </button>

      </form>

      <p id="statusMessage" class="status"></p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
