<form
  id="userForm"
  action="https://script.google.com/macros/s/AKfycbyVClOxUo_GtOwJJrBg-tl9QQxqTVqvulx7fbgXpzMb8J_Lh2jIYAs7LsBMyLWiHR5-/exec"
  method="POST"
  target="hidden_iframe"
>

  <div class="form-group">
    <label>First Name</label>
    <input type="text" name="firstName" required />
  </div>

  <div class="form-group">
    <label>Last Name</label>
    <input type="text" name="lastName" required />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" required />
  </div>

  <div class="form-group">
    <label>Gender</label>
    <select name="gender" required>
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
      <option>Prefer not to say</option>
    </select>
  </div>

  <div class="form-group">
    <label>Date of Birth</label>
    <input type="date" name="birthday" required />
  </div>

  <div class="form-group consent">
    <input type="checkbox" id="consent" required />
    <label for="consent">I consent to submitting this information.</label>
  </div>

  <button type="submit">Submit</button>
</form>

<!-- Hidden iframe prevents redirect -->
<iframe name="hidden_iframe" style="display:none;"></iframe>
